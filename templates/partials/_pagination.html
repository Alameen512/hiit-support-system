{% if page.paginator.num_pages > 1 %}
<nav class="pager" aria-label="Pagination">
  {% if page.has_previous %}<a href="?{% if querystring %}{{ querystring }}&amp;{% endif %}page={{ page.previous_page_number }}"><i class="bi bi-chevron-left"></i> Prev</a>{% endif %}
  <span>Page {{ page.number }} of {{ page.paginator.num_pages }}</span>
  {% if page.has_next %}<a href="?{% if querystring %}{{ querystring }}&amp;{% endif %}page={{ page.next_page_number }}">Next <i class="bi bi-chevron-right"></i></a>{% endif %}
</nav>{% endif %}
